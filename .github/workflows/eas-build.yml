name: EAS Build iOS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      mode:
        description: 'build = compile + submit; submit-only = reuse last build'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - submit-only

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build on EAS
        run: |
          if [ "${{ inputs.mode }}" = "submit-only" ]; then
            eas submit --platform ios --profile "${{ inputs.profile }}" --latest --non-interactive
          elif [ "${{ inputs.profile }}" = "production" ]; then
            eas build --platform ios --profile production --non-interactive --auto-submit
          else
            eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive
          fi
